name: Feature request
description: Suggest a new detection rule, remediation, integration, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure mode or workflow is Triton missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: If this changes what Triton does to a cluster, which safety rails apply?
