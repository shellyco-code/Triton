# Least-privilege access: read pods/logs/events everywhere, delete pods (restart).
# Nothing else - no secrets, no deployments, no exec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triton
  namespace: triton
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triton
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triton
subjects:
  - kind: ServiceAccount
    name: triton
    namespace: triton
