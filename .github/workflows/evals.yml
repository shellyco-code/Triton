name: Agent evals

# Runs the real LLM against recorded scenarios. Manual only: it costs API
# credits and needs the GROQ_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Trials per scenario
        default: "3"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m evals.run --trials "${{ inputs.trials }}" --json eval-results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results.json
