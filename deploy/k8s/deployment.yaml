apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-data
  namespace: triton
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: triton-config
  namespace: triton
data:
  AUTO_REMEDIATE: "false"
  POLL_INTERVAL_SECONDS: "30"
  TRIAGE_COOLDOWN_MINUTES: "10"
  MAX_RESTARTS_PER_WINDOW: "2"
  RESTART_WINDOW_MINUTES: "30"
  PROTECTED_NAMESPACES: "kube-system,kube-public,kube-node-lease,triton"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: triton
  labels: {app: triton}
spec:
  # SQLite + a single poller: exactly one replica, never two at once.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: triton}
  template:
    metadata:
      labels: {app: triton}
    spec:
      serviceAccountName: triton
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: triton
          image: triton:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: triton-config}
            # kubectl -n triton create secret generic triton-secrets \
            #   --from-literal=GROQ_API_KEY=... --from-literal=TRITON_API_TOKEN=...
            - secretRef: {name: triton-secrets}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: triton-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: triton
spec:
  selector: {app: triton}
  ports:
    - port: 80
      targetPort: 8000
