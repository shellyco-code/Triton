# Generate the Xcode project with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen && open TritonCompanion.xcodeproj
name: TritonCompanion
options:
  bundleIdPrefix: dev.triton
  deploymentTarget:
    iOS: "17.0"
targets:
  TritonCompanion:
    type: application
    platform: iOS
    sources: [TritonCompanion]
    info:
      path: TritonCompanion/Info.plist
      properties:
        CFBundleDisplayName: Triton
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Triton Companion connects to your Triton server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
