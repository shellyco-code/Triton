<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Triton Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg-main:#0b0f14;
--bg-card:#11161d;
--bg-card-hover:#151b23;
--bg-panel:#0d1117;
--text-primary:#d6dde6;
--text-secondary:#7d8590;
--text-muted:#5f6874;
--border:#2a3038;
--border-strong:#3a424d;
--accent:#f59e0b;
--success:#f59e0b;
--pending:#c76a37;
--accent-soft:rgba(245,158,11,.1);
--accent-border:rgba(245,158,11,.32);
--pending-soft:rgba(199,106,55,.11);
--mono:'JetBrains Mono',monospace;
--sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{
box-sizing:border-box;
}
body{
background:var(--bg-main);
color:var(--text-primary);
font-family:var(--sans);
margin:0;
padding:1.5rem;
line-height:1.45;
}
.container{
max-width:1000px;
margin:0 auto;
}
header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:1.25rem;
padding-bottom:.75rem;
border-bottom:1px solid var(--border);
}
h1{
font-size:1.45rem;
font-weight:600;
margin:0;
color:#f4f7fb;
letter-spacing:-.04em;
}
.status-badge{
display:flex;
align-items:center;
gap:.45rem;
font-family:var(--mono);
font-size:.72rem;
font-weight:500;
letter-spacing:.02em;
text-transform:uppercase;
color:var(--accent);
background:var(--accent-soft);
padding:.3rem .5rem;
border-radius:4px;
border:1px solid var(--accent-border);
}
.dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 10px rgba(245,158,11,.7);
animation:pulse 1.8s infinite;
}
@keyframes pulse{
0%{opacity:1;transform:scale(1)}
50%{opacity:.48;transform:scale(1.18)}
100%{opacity:1;transform:scale(1)}
}
#incidents-container{
display:flex;
flex-direction:column;
gap:.55rem;
}
.incident-card{
background:var(--bg-card);
border:1px solid var(--border);
border-left:4px solid transparent;
border-radius:4px;
overflow:hidden;
transition:background-color .16s ease,border-color .16s ease;
box-shadow:none;
}
.incident-card.status-resolved{
border-left-color:var(--success);
}
.incident-card.status-pending{
border-left-color:var(--pending);
}
.incident-card:hover{
background:var(--bg-card-hover);
border-color:var(--border-strong);
}
.incident-card.status-resolved:hover{
border-left-color:var(--success);
}
.incident-card.status-pending:hover{
border-left-color:var(--pending);
}
.incident-header{
padding:.75rem .875rem;
cursor:pointer;
display:grid;
grid-template-columns:minmax(0,1fr) auto;
gap:.75rem;
align-items:center;
}
.incident-title{
min-width:0;
display:flex;
flex-direction:column;
gap:.24rem;
}
.pod-name{
font-family:var(--mono);
font-size:.95rem;
font-weight:700;
line-height:1.2;
color:#f3f4f6;
letter-spacing:-.02em;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.incident-meta{
display:flex;
align-items:center;
gap:.5rem;
min-width:0;
}
.detected-time{
font-family:var(--mono);
font-size:.72rem;
font-weight:400;
color:var(--text-secondary);
white-space:nowrap;
}
.status-label{
font-family:var(--mono);
font-size:.68rem;
font-weight:500;
line-height:1;
color:var(--text-muted);
text-transform:uppercase;
letter-spacing:.04em;
}
.diagnosis-preview{
font-family:var(--mono);
font-size:.78rem;
font-weight:400;
line-height:1.35;
color:var(--text-secondary);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.expand-icon{
font-family:var(--mono);
font-size:.8rem;
color:var(--text-secondary);
transition:transform .16s ease,color .16s ease;
line-height:1;
}
.incident-card:hover .expand-icon{
color:var(--accent);
}
.incident-card.expanded .expand-icon{
transform:rotate(180deg);
}
.incident-body{
display:none;
padding:.875rem;
border-top:1px solid var(--border);
background:var(--bg-panel);
}
.incident-card.expanded .incident-body{
display:block;
animation:fadeIn .16s ease;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(-4px)}
to{opacity:1;transform:translateY(0)}
}
h3{
font-size:.78rem;
font-weight:600;
letter-spacing:.04em;
text-transform:uppercase;
margin:0 0 .45rem;
color:#f4f7fb;
}
pre{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:4px;
padding:.75rem;
overflow-x:auto;
font-family:var(--mono);
font-size:.82rem;
line-height:1.5;
color:var(--text-primary);
white-space:pre-wrap;
margin:0 0 .875rem;
}
.trace-box{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:4px;
padding:.65rem .75rem;
}
.trace-item{
font-family:var(--mono);
font-size:.78rem;
line-height:1.45;
padding:.42rem 0;
border-bottom:1px dashed var(--border);
}
.trace-item:first-child{
padding-top:0;
}
.trace-item:last-child{
padding-bottom:0;
border-bottom:none;
}
.tool-name{
color:var(--accent);
font-weight:700;
}
.tool-args{
color:var(--text-secondary);
}
.empty-state{
text-align:center;
padding:2.5rem;
font-family:var(--mono);
font-size:.82rem;
color:var(--text-secondary);
}
.remediation-badge {
font-family:var(--mono);
font-size:0.7rem;
font-weight:600;
padding:0.2rem 0.4rem;
border-radius:4px;
border:1px solid;
white-space:nowrap;
display:inline-block;
margin-left:0.5rem;
vertical-align:middle;
}
.badge-executed {
color:#10b981;
background:rgba(16,185,129,0.1);
border-color:rgba(16,185,129,0.3);
}
.badge-pending {
color:var(--accent);
background:var(--accent-soft);
border-color:var(--accent-border);
}
.badge-skipped {
color:#ef4444;
background:rgba(239,68,68,0.1);
border-color:rgba(239,68,68,0.3);
}
.badge-error {
color:var(--text-secondary);
background:rgba(125,133,144,0.1);
border-color:rgba(125,133,144,0.3);
}
.badge-manual {
color:#60a5fa;
background:rgba(96,165,250,0.1);
border-color:rgba(96,165,250,0.3);
}
.meta-row{
font-family:var(--mono);
font-size:.75rem;
color:var(--text-secondary);
margin:0 0 .875rem;
display:flex;
flex-wrap:wrap;
gap:.35rem 1.25rem;
}
.meta-row b{color:var(--text-primary);font-weight:500;}
.tool-err{color:#ef4444;}
.actions{display:flex;align-items:center;gap:.75rem;margin-top:.875rem;flex-wrap:wrap;}
.btn{
background:var(--accent);
color:#000;
border:none;
padding:.45rem .9rem;
border-radius:4px;
font-size:.78rem;
font-weight:600;
cursor:pointer;
}
.btn:disabled{opacity:.5;cursor:wait;}
.token-input{
background:var(--bg-card);
border:1px solid var(--border);
color:var(--text-primary);
padding:.4rem .6rem;
border-radius:4px;
font-family:var(--mono);
font-size:.75rem;
width:220px;
}
.banner{
font-family:var(--mono);
font-size:.78rem;
padding:.6rem .8rem;
border-radius:4px;
margin-bottom:.75rem;
display:none;
border:1px solid rgba(239,68,68,.3);
background:rgba(239,68,68,.08);
color:#fca5a5;
}
.banner.show{display:block;}
.ns{color:var(--text-muted);font-weight:400;}
@media (max-width:640px){
body{padding:1rem;}
header{flex-direction:column;align-items:flex-start;gap:.75rem;}
.token-input{width:100%;}
}
</style>
</head>
<body>
<div class="container">
<header>
<div style="display:flex;align-items:center;gap:1rem;">
<h1>Triton</h1>
<div class="status-badge"><div class="dot"></div>Live</div>
</div>
<div style="display:flex;align-items:center;gap:.5rem;">
<input type="password" id="token-input" class="token-input" placeholder="API token (if server requires one)" autocomplete="off">
<button class="btn" onclick="setToken()">Set</button>
</div>
</header>
<div id="banner" class="banner"></div>
<div id="incidents-container">
<div class="empty-state">Loading incidents...</div>
</div>
</div>
<script>
const expandedIncidents = new Set();
let apiToken = '';

function setToken() {
  const input = document.getElementById('token-input');
  apiToken = input.value.trim();
  input.value = '';
  input.placeholder = apiToken ? 'Token set for this tab' : 'API token (if server requires one)';
}

function showBanner(msg) {
  const b = document.getElementById('banner');
  b.textContent = msg || '';
  b.classList.toggle('show', !!msg);
}

function toggleIncident(id) {
  const card = document.getElementById(`incident-${id}`);
  if (expandedIncidents.has(id)) { expandedIncidents.delete(id); card.classList.remove('expanded'); }
  else { expandedIncidents.add(id); card.classList.add('expanded'); }
}

function formatRelativeTime(isoString) {
  const diff = Date.now() - new Date(isoString).getTime();
  const s = Math.floor(Math.abs(diff) / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (s < 10) return 'now';
  const v = s < 60 ? `${s}s` : m < 60 ? `${m}m` : h < 24 ? `${h}h` : `${d}d`;
  return diff < 0 ? `in ${v}` : `${v} ago`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatPreview(diagnosis) {
  const text = String(diagnosis || 'Agent triage in progress...').replace(/\s+/g, ' ').trim();
  return text.length > 120 ? `${text.slice(0, 117)}...` : text;
}

function formatTrace(trace) {
  if (!Array.isArray(trace) || trace.length === 0) return '<div class="trace-item">No tools called.</div>';
  return trace.map(t => {
    const args = t.input && Object.keys(t.input).length ? JSON.stringify(t.input) : '';
    const timing = t.duration_ms != null ? ` <span class="tool-args">${t.duration_ms}ms</span>` : '';
    const err = t.ok === false ? `<div class="tool-err">${escapeHtml(t.error)}</div>` : '';
    return `<div class="trace-item"><span class="tool-name">› ${escapeHtml(t.tool)}</span>
      <span class="tool-args">${escapeHtml(args)}</span>${timing}${err}</div>`;
  }).join('');
}

const BADGES = {
  executed: ['badge-executed', inc => `Restarted ${inc.executed_at ? formatRelativeTime(inc.executed_at) : ''}`],
  pending_approval: ['badge-pending', () => 'Restart pending approval'],
  skipped_by_safety: ['badge-skipped', () => 'Blocked by safety rail'],
  manual_intervention: ['badge-manual', () => 'Needs a human'],
  failed: ['badge-skipped', () => 'Remediation failed'],
  parse_error: ['badge-error', () => 'Parse error'],
};

function badge(inc) {
  if (!inc.action_status) return '';
  const [cls, label] = BADGES[inc.action_status] || ['badge-error', () => inc.action_status];
  return `<span class="remediation-badge ${cls}">${escapeHtml(label(inc))}</span>`;
}

function authHeaders() {
  return apiToken ? { Authorization: `Bearer ${apiToken}` } : {};
}

async function approve(diagnosisId, button) {
  button.disabled = true;
  try {
    const r = await fetch(`/remediate/${diagnosisId}`, { method: 'POST', headers: authHeaders() });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) showBanner(`Remediation ${r.status}: ${body.detail || r.statusText}`);
    else showBanner(body.status === 'executed' ? '' : `Not executed: ${body.detail}`);
  } catch (e) {
    showBanner(`Request failed: ${e}`);
  }
  await fetchIncidents();
}

function renderIncident(inc) {
  const hasDiagnosis = !!inc.diagnosis;
  const meta = `<div class="meta-row">
    <span>namespace <b>${escapeHtml(inc.namespace)}</b></span>
    <span>workload <b>${escapeHtml(inc.workload)}</b></span>
    <span>issues <b>${escapeHtml((inc.issues || []).join(', '))}</b></span>
    ${inc.agent_iterations ? `<span>agent turns <b>${inc.agent_iterations}</b></span>` : ''}
  </div>`;
  const outcome = inc.status_detail ? '\n\nOutcome: ' + escapeHtml(inc.status_detail) : '';
  const reason = inc.proposal_reason ? '\n' + escapeHtml(inc.proposal_reason) : '';
  const proposal = inc.proposed_action_type
    ? `<h3>Proposed action</h3><pre>${escapeHtml(inc.proposed_action_type)} → ${escapeHtml(inc.proposed_target)}${reason}${outcome}</pre>`
    : '';
  const canApprove = inc.action_status === 'pending_approval' && inc.proposed_action_type === 'restart_pod';
  const actions = canApprove ? `<div class="actions">
    <button class="btn" onclick="event.stopPropagation(); approve(${inc.diagnosis_id}, this)">Approve restart</button>
    <span class="tool-args">Runs every safety rail before deleting the pod.</span></div>` : '';
  const body = hasDiagnosis
    ? `${meta}<h3>Diagnosis</h3><pre>${escapeHtml(inc.diagnosis)}</pre>${proposal}
       <h3>Tool execution trace</h3><div class="trace-box">${formatTrace(inc.tool_trace)}</div>${actions}`
    : `${meta}<div class="empty-state" style="padding:1.25rem;">Agent is triaging this pod...</div>`;
  const cardState = hasDiagnosis ? 'status-resolved' : 'status-pending';
  const expanded = expandedIncidents.has(inc.id) ? 'expanded' : '';

  return `<div class="incident-card ${cardState} ${expanded}" id="incident-${inc.id}">
    <div class="incident-header" onclick="toggleIncident(${inc.id})">
      <div class="incident-title">
        <span class="pod-name">${escapeHtml(inc.pod_name)} <span class="ns">${escapeHtml(inc.namespace)}</span></span>
        <div class="incident-meta">
          <span class="detected-time">${formatRelativeTime(inc.detected_at)}</span>
          ${badge(inc)}
        </div>
        <span class="diagnosis-preview">${escapeHtml(formatPreview(inc.diagnosis))}</span>
      </div>
      <div class="expand-icon" aria-hidden="true">&#9662;</div>
    </div>
    <div class="incident-body">${body}</div>
  </div>`;
}

async function fetchIncidents() {
  const container = document.getElementById('incidents-container');
  try {
    const r = await fetch('/incidents');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const incidents = await r.json();
    container.innerHTML = incidents.length
      ? incidents.map(renderIncident).join('')
      : '<div class="empty-state">No incidents yet. Cluster looks healthy.</div>';
  } catch (e) {
    showBanner(`Could not load incidents: ${e.message}`);
  }
}

fetchIncidents();
setInterval(fetchIncidents, 10000);
</script>
</body>
</html>
